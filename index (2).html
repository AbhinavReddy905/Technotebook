<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TechNotebook – Learn &amp; Type</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1a1d29;--mu:#9aa0b4;--bd:#e3e6f0;--ac:#4f46e5;--ok:#111;--bad:#fecaca;--badt:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b25;--tx:#e8eaf2;--mu:#5d647b;--bd:#2a2e3d;--ac:#818cf8;--ok:#f5f5f5;--bad:#7f1d1d;--badt:#fca5a5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b25;--tx:#e8eaf2;--mu:#5d647b;--bd:#2a2e3d;--ac:#818cf8;--ok:#f5f5f5;--bad:#7f1d1d;--badt:#fca5a5;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}nav{width:220px;padding:16px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav h1{font-size:18px;margin:0 0 8px;color:var(--ac)}nav button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;cursor:pointer;transition:.15s}
nav button{text-align:left;border-color:transparent}nav button:hover,.btn:hover{border-color:var(--ac)}nav button.on{background:var(--ac);color:#fff}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%}
main{flex:1;padding:24px;max-width:960px;min-width:0}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.stat b{display:block;font-size:26px}.stat span,.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);margin-right:6px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ans{font:20px/1.8 ui-monospace,Menlo,Consolas,monospace;color:var(--mu);padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);word-break:break-word;white-space:pre-wrap}.ov{position:absolute;inset:0;width:100%;height:100%;opacity:0;resize:none;border:0;padding:0}
.ans span{transition:color .12s}.ans .ok{color:var(--ok)}.ans .bad{background:var(--bad);color:var(--badt);border-radius:3px}.ans .cur{border-left:2px solid var(--ac)}
pre{background:var(--bd);padding:12px;border-radius:10px;overflow-x:auto}.bm{color:#f59e0b}.lbl{font-weight:600}
.g{border-left:4px solid #10b981}.s{border-left:4px solid #f59e0b}.r{border-left:4px solid var(--ac)}
@media(max-width:720px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--bd)}nav h1{width:100%}main{padding:14px}}
</style></head><body><div class="app"><nav id="nav"></nav><main id="m"></main></div>

let DATA,P={read:{},bm:[],prac:[],last:'',mode:'g'},R='',ST={};
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const idb=()=>new Promise((a,b)=>{try{const r=indexedDB.open('tn',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>a(r.result);r.onerror=b}catch(e){b()}});
async function load(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('p');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
async function save(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(P)),'p')}catch(e){}}
const T=()=>DATA.flatMap(t=>t.subjects.flatMap(s=>s.topics.map(p=>({...p,tech:t,subj:s,qa:p.qa||[],body:p.body||[]}))));
const topic=id=>T().find(x=>x.id===id);
const NAV=[['','Dashboard'],['learn','Learn'],['g','Guided Practice'],['s','Self-Test'],['c','Code Practice'],['bm','Bookmarks'],['manage','Manage']];
function go(r){R=r;P.last=r;save();render()}
function render(){
$('#nav').innerHTML=`<h1>TechNotebook</h1><input id="q" placeholder="Search…" oninput="srch(this.value)" aria-label="Search">`+NAV.map(([k,n])=>`<button class="${R.split('/')[0]===k||(k==='learn'&&R.startsWith('read'))?'on':''}" onclick="go('${k}')">${n}</button>`).join('')+`<button onclick="theme()">Toggle theme</button>`;
const [a,b,c,d]=R.split('/'),m=$('#m');window.scrollTo(0,0);
if(a==='')dash(m);else if(a==='learn')learn(m,b);else if(a==='read')read(m,b);else if(a==='g'||a==='s')pick(m,a);else if(a==='c')codes(m);
else if(a==='p')prac(m,b,c,+d);else if(a==='bm')bms(m);else if(a==='manage')manage(m);else if(a==='q')results(m,decodeURIComponent(b||''))}
function theme(){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';ls('theme',r.dataset.theme)}
function srch(v){if(v.trim()){R='q/'+encodeURIComponent(v);const m=$('#m');results(m,v)}else go('')}
function results(m,q){q=q.toLowerCase();const ts=T().filter(t=>(t.title+t.tech.name+t.subj.name).toLowerCase().includes(q));
const qs=T().flatMap(t=>t.qa.map((x,i)=>({t,i,q:x[0]}))).filter(x=>x.q.toLowerCase().includes(q));
m.innerHTML=`<h2>Results for “${esc(q)}”</h2>`+(ts.map(t=>`<div class="card r row"><span class="tag">${esc(t.tech.name)}</span><b>${esc(t.title)}</b><button class="btn" onclick="go('read/${t.id}')">Read</button></div>`).join('')+qs.map(x=>`<div class="card g row"><span>${esc(x.q)}</span><button class="btn" onclick="go('p/g/${x.t.id}/${x.i}')">Guided</button><button class="btn" onclick="go('p/s/${x.t.id}/${x.i}')">Self-Test</button></div>`).join('')||'<p class="mu">Nothing found.</p>')}
function dash(m){const ts=T(),nq=ts.reduce((n,t)=>n+t.qa.length,0),done=ts.filter(t=>P.read[t.id]?.done).length,g=P.prac.filter(x=>x.wpm),avg=k=>g.length?Math.round(g.reduce((s,x)=>s+x[k],0)/g.length):0;
const pq=new Set(P.prac.map(x=>x.t+x.i)).size,pct=ts.length?Math.round(done/ts.length*100):0,last=P.prac.slice(-10);
m.innerHTML=`<h2>Dashboard</h2><div class="grid">${[['Technologies',DATA.length],['Topics',ts.length],['Questions',nq],['Topics completed',done],['Questions practised',pq],['Avg WPM',avg('wpm')],['Avg accuracy',avg('acc')+'%']].map(([a,b])=>`<div class="card stat"><b>${b}</b><span>${a}</span></div>`).join('')}</div>
<div class="card"><div class="lbl">Overall reading progress: ${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div></div>
<div class="card"><div class="lbl">Recent WPM</div><div class="row" style="align-items:flex-end;height:90px">${last.map(x=>`<div title="${x.wpm||0} wpm" style="width:22px;background:var(--ac);border-radius:4px 4px 0 0;height:${Math.min(90,(x.wpm||x.acc/3)*1.2)}px"></div>`).join('')||'<span class="mu">Practise to see your chart.</span>'}</div></div>
<div class="row" style="margin-bottom:14px">${P.last&&P.last!==''&&!P.last.startsWith('q')?`<button class="btn p" onclick="go('${P.last}')">Continue where you left off</button>`:''}<button class="btn" onclick="go('g')">Continue practising</button><button class="btn" onclick="go('learn')">Continue learning</button></div>
<div class="card"><div class="lbl">Recent activity</div>${P.prac.slice(-5).reverse().map(x=>`<div class="mu">${x.mode==='g'?'Guided':'Self-Test'} · ${esc(x.q)} · ${x.acc}% · ${new Date(x.at).toLocaleDateString()}</div>`).join('')||'<span class="mu">No activity yet.</span>'}</div>`}
function learn(m,id){if(!id){m.innerHTML=`<h2>Learn</h2><div class="grid">${DATA.map(t=>{const n=t.subjects.flatMap(s=>s.topics);const d=n.filter(x=>P.read[x.id]?.done).length;return`<div class="card r" style="cursor:pointer" onclick="go('learn/${t.id}')"><b>${esc(t.name)}</b><div class="mu">${n.length} topics · ${d} done</div></div>`}).join('')}</div>`;return}
const t=DATA.find(x=>x.id===id);m.innerHTML=`<button class="btn" onclick="go('learn')">← All technologies</button><h2>${esc(t.name)}</h2>`+t.subjects.map(s=>`<div class="card"><div class="lbl">${esc(s.name)}</div>${s.topics.map(p=>`<div class="row" style="padding:6px 0"><button class="btn" onclick="go('read/${p.id}')">${P.read[p.id]?.done?'✓ ':''}${esc(p.title)}</button>${P.bm.includes(p.id)?'<span class="bm">★</span>':''}</div>`).join('')}</div>`).join('')}
function fmt(l){l=String(l);if(l.startsWith('## '))return`<h3>${esc(l.slice(3))}</h3>`;if(l.startsWith('    '))return`<pre><code>${esc(l.replace(/^ {4}/gm,''))}</code></pre>`;if(l.startsWith('- '))return`<ul>${l.split('\n').map(x=>`<li>${esc(x.replace(/^- /,''))}</li>`).join('')}</ul>`;return`<p>${esc(l)}</p>`}
function read(m,id){const t=topic(id);if(!t)return go('learn');P.last='read/'+id;(P.read[id]=P.read[id]||{}).at=Date.now();save();const bm=P.bm.includes(id);
m.innerHTML=`<button class="btn" onclick="go('learn/${t.tech.id}')">← ${esc(t.tech.name)}</button><div class="card r" style="margin-top:12px"><span class="tag">${esc(t.subj.name)}</span><h2 style="margin:6px 0">${esc(t.title)}</h2>${t.body.map(fmt).join('')}</div>
<div class="row"><button class="btn" onclick="tg('bm','${id}')">${bm?'★ Bookmarked':'☆ Bookmark'}</button><button class="btn p" onclick="tg('done','${id}')">${P.read[id].done?'✓ Completed':'Mark complete'}</button><button class="btn" onclick="go('p/g/${id}/0')">Guided practice</button><button class="btn" onclick="go('p/s/${id}/0')">Self-Test</button></div>`}
function tg(k,id){if(k==='bm'){const i=P.bm.indexOf(id);i<0?P.bm.push(id):P.bm.splice(i,1)}else P.read[id].done=!P.read[id].done;save();render()}
function bms(m){m.innerHTML='<h2>Bookmarks</h2>'+(P.bm.map(topic).filter(Boolean).map(t=>`<div class="card r row"><span class="tag">${esc(t.tech.name)}</span><b>${esc(t.title)}</b><button class="btn" onclick="go('read/${t.id}')">Open</button></div>`).join('')||'<p class="mu">No bookmarks yet. Open a topic and press Bookmark.</p>')}
function pick(m,mode){P.mode=mode;ls('mode',mode);m.innerHTML=`<h2>${mode==='g'?'Guided Practice':'Self-Test'}</h2><p class="mu">${mode==='g'?'Type the grey answer. Correct characters turn black.':'Answer from memory, then submit to compare.'}</p><label class="mu">Technology <select onchange="ST.f=this.value;pick($('#m'),'${mode}')"><option value="">All</option>${DATA.map(t=>`<option value="${t.id}" ${ST.f===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><br><br>`+T().filter(t=>!ST.f||t.tech.id===ST.f).filter(t=>t.qa.length).map(t=>`<div class="card ${mode}"><span class="tag">${esc(t.tech.name)}</span><b>${esc(t.title)}</b> <span class="mu">${t.qa.length} questions</span><div><button class="btn p" onclick="go('p/${mode}/${t.id}/0')">Start</button></div></div>`).join('')}
function prac(m,mode,id,i){const t=topic(id);if(!t||!t.qa[i])return go(mode);P.last=`p/${mode}/${id}/${i}`;save();const [q,a,kind]=t.qa[i],nx=i+1<t.qa.length?`go('p/${mode}/${id}/${i+1}')`:`go('${mode}')`;
ST.p={start:0,keys:0,errs:0,len:0,done:false};
m.innerHTML=`<button class="btn" onclick="go('${mode}')">← Topics</button><div class="card ${mode}" style="margin-top:12px"><span class="tag">${mode==='g'?'Guided':'Self-Test'}</span><span class="mu">${esc(t.title)} · ${i+1}/${t.qa.length}</span><h2 style="margin:6px 0">${esc(q)}</h2>
${mode==='g'?`<div class="ans" style="position:relative;min-height:90px;cursor:text"><div id="ans" aria-live="off"></div><textarea id="inp" class="ov" aria-label="Type the answer here" autocomplete="off" spellcheck="false" onpaste="return false"></textarea></div><p class="mu">Click the box and start typing. The grey text fills in as you type.</p>`:`<textarea id="inp" rows="5" placeholder="Type your answer from memory…"></textarea><div class="row" style="margin-top:8px"><button class="btn p" id="sub">Submit Answer</button></div>`}
<div id="res"></div></div><div class="row"><button class="btn" onclick="go('p/${mode}/${id}/${i}')">Retry</button><button class="btn p" onclick="${nx}">Next Question</button></div>`;
const inp=$('#inp');inp.focus();inp.onkeydown=e=>{if(e.key==='Tab'&&kind){e.preventDefault();document.execCommand('insertText',false,'    ')}};
if(mode==='g'){const draw=()=>{const v=inp.value;$('#ans').innerHTML=[...a].map((c,k)=>`<span class="${k<v.length?(v[k]===c?'ok':'bad'):''}${k===v.length?' cur':''}">${esc(c)}</span>`).join('')};draw();
inp.oninput=()=>{const p=ST.p,v=inp.value;if(p.done)return;if(!p.start)p.start=Date.now();for(let k=p.len;k<v.length;k++){p.keys++;if(v[k]!==a[k])p.errs++}p.len=v.length;draw();
if(v===a){p.done=true;inp.disabled=true;const sec=Math.max(1,Math.round((Date.now()-p.start)/1000)),wpm=Math.round(a.length/5/(sec/60)),acc=Math.round((p.keys-p.errs)/p.keys*100);
P.prac.push({t:id,i,mode:'g',q,wpm,acc,sec,at:Date.now()});P.read[id]=P.read[id]||{};save();$('#res').innerHTML=`<p class="lbl">Done! ${wpm} WPM · ${acc}% accuracy · ${sec}s</p>`}}}
else{inp.oninput=()=>{if(!ST.p.start)ST.p.start=Date.now()};$('#sub').onclick=()=>{const u=inp.value.trim();if(!u)return;const W=s=>[...new Set(s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>(kind?1:3)))],aw=W(a),uw=W(u),hit=aw.filter(w=>uw.includes(w)),miss=aw.filter(w=>!uw.includes(w)),cov=aw.length?Math.round(hit.length/aw.length*100):0,sec=Math.max(1,Math.round((Date.now()-(ST.p.start||Date.now()))/1000));
P.prac.push({t:id,i,mode:'s',q,acc:cov,sec,wpm:Math.round(u.length/5/(sec/60)),at:Date.now()});save();inp.disabled=true;$('#sub').disabled=true;
$('#res').innerHTML=`<p class="lbl">${cov>=60?'Good recall':'Needs review'} · ${cov}% of key points covered · ${sec}s</p><div class="ans" style="color:var(--tx);font-size:16px"><b>Expected:</b> ${esc(a)}</div>${miss.length?`<p><b>Missing:</b> ${miss.map(esc).join(', ')}</p>`:'<p>You covered every key point.</p>'}`}}}
function codes(m){const L=T().flatMap(t=>t.qa.map((x,i)=>({t,i,x})).filter(o=>o.x[2]));m.innerHTML='<h2>Code Practice</h2><p class="mu">Coding questions only. Type the solution in guided mode, or write it yourself first.</p>'+(L.map(o=>`<div class="card g"><span class="tag">${esc(o.t.tech.name)}</span><b>${esc(o.x[0])}</b><div class="row" style="margin-top:8px"><button class="btn p" onclick="go('p/g/${o.t.id}/${o.i}')">Type guided</button><button class="btn" onclick="go('p/s/${o.t.id}/${o.i}')">Try yourself</button></div></div>`).join('')||'<p class="mu">No coding questions yet.</p>')}
function manage(m){m.innerHTML=`<h2>Manage</h2><div class="card r"><div class="lbl">Content (update anytime)</div><p class="mu">Edit the JSON below, or paste a new content pack, then press Apply. Structure: technologies → subjects → topics → body lines + qa pairs. Body lines: “## ” heading, “- ” bullets, lines starting with 4 spaces are code. Topics need unique ids.</p><textarea id="cj" rows="14" style="font-family:monospace;font-size:12px">${esc(JSON.stringify(DATA,null,1))}</textarea><div class="row" style="margin-top:8px"><button class="btn p" onclick="applyC()">Apply content</button><button class="btn" onclick="ls('content',null);DATA=SEED;go('manage')">Restore built-in</button><button class="btn" onclick="addC()">Merge as extra pack</button></div><p id="cmsg" class="mu"></p></div>
<div class="card"><div class="lbl">Progress backup</div><p class="mu">Progress is stored in this browser on this device only. Export a backup to move it elsewhere.</p><div class="row"><button class="btn" onclick="exp()">Export progress</button><label class="btn">Import progress<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="btn" onclick="if(confirm('Reset all progress?')){P={read:{},bm:[],prac:[],last:'',mode:'g'};save();go('')}">Reset progress</button></div></div>`}
function parseC(){try{const d=JSON.parse($('#cj').value);if(!Array.isArray(d)||d.some(t=>!t.id||!Array.isArray(t.subjects)))throw 0;return d}catch(e){$('#cmsg').textContent='Invalid JSON structure.';return null}}
function applyC(){const d=parseC();if(d){DATA=d;ls('content',d);$('#cmsg').textContent='Content updated.'}}
function addC(){const d=parseC();if(!d)return;const m=new Map(SEED.concat(ls('content')||[]).map(t=>[t.id,t]));d.forEach(t=>m.set(t.id,t));DATA=[...m.values()];ls('content',DATA);$('#cmsg').textContent='Merged.'}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));a.download='technotebook-progress.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.read||!d.prac)throw 0;P=d;save();go('')}catch(e){alert('Not a valid backup file.')}})}
(async()=>{const th=ls('theme');if(th)document.documentElement.dataset.theme=th;DATA=ls('content')||SEED;const p=await load();if(p)P=Object.assign(P,p);R=(P.last||'').startsWith('q')?'':P.last||'';render()})();
</script></body></html>
